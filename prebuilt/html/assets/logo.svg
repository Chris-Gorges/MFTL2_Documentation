<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="MFTL">
  <title>MFTL</title>
  <!-- One 1-to-4 subdivision of a triangle: the operation the icosphere
       generator applies, and the smallest picture of what this library holds. -->
  <g fill="none" stroke="#ffffff" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round">
    <path d="M16 3.2 L28.6 26 L3.4 26 Z"/>
    <path d="M9.7 14.6 L22.3 14.6 L16 26 Z"/>
  </g>
  <g fill="#ffffff">
    <circle cx="16" cy="3.2" r="2.1"/>
    <circle cx="28.6" cy="26" r="2.1"/>
    <circle cx="3.4" cy="26" r="2.1"/>
    <circle cx="9.7" cy="14.6" r="1.6"/>
    <circle cx="22.3" cy="14.6" r="1.6"/>
    <circle cx="16" cy="26" r="1.6"/>
  </g>
</svg>

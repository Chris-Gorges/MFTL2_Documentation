# ══════════════════════════════════════════════════════════════════════════════
#  MFTL -- documentation toolchain, KNOWN-GOOD versions
#
#  Every package, transitive ones included, at the exact version the manual was
#  last built and checked with (Python 3.14, macOS). build_mkdocs.py installs
#  requirements-docs.txt WITH THIS FILE AS CONSTRAINTS, so a fresh machine gets
#  the same renderer as the last one that worked -- pymdown-extensions, for
#  example, is not named in requirements-docs.txt at all and would otherwise
#  float to whatever is newest.
#
#  If these pins cannot be satisfied (an older Python, a platform without a
#  wheel), the installer says so and falls back to requirements-docs.txt alone.
#
#  Refresh after a toolchain upgrade that was checked to build cleanly:
#      .venv-docs/bin/python -m pip freeze > requirements-docs.lock
#  and put this header back.
# ══════════════════════════════════════════════════════════════════════════════
